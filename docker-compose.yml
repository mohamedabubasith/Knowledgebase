services:
  api:
    build: {context: ., dockerfile: app/Dockerfile}
    env_file: .env
    environment:
      HF_HOME: /app/models
      TRANSFORMERS_CACHE: /app/models
      HF_HUB_CACHE: /app/models
    volumes: [models:/app/models]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: app/Dockerfile.worker}
    env_file: .env
    environment:
      HF_HOME: /app/models
      TRANSFORMERS_CACHE: /app/models
      HF_HUB_CACHE: /app/models
    volumes: [models:/app/models]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment: {BACKEND_URL: http://api:8000/api/v1}
    depends_on: [api]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, frontend]
    restart: unless-stopped
volumes: {models: {}, redis_data: {}}
