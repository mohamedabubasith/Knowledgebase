services:
  api:
    build: {context: ., dockerfile: app/Dockerfile}
    env_file: .env
    volumes: [uploads:/app/uploads]
    depends_on:
      redis: {condition: service_healthy}
      model_puller: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: app/Dockerfile.worker}
    env_file: .env
    volumes: [uploads:/app/uploads]
    depends_on:
      redis: {condition: service_healthy}
      model_puller: {condition: service_completed_successfully}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_models:/root/.ollama]
    healthcheck: {test: [CMD-SHELL, "ollama list >/dev/null 2>&1"], interval: 10s, timeout: 5s, retries: 30}
    restart: unless-stopped
  model_puller:
    image: ollama/ollama:latest
    environment: {OLLAMA_HOST: http://ollama:11434}
    entrypoint: [sh, -c, "ollama pull nomic-embed-text && ollama pull llama3.2:3b"]
    depends_on:
      ollama: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment: {BACKEND_URL: http://api:8000/api/v1}
    depends_on: [api]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, frontend]
    restart: unless-stopped
volumes: {uploads: {}, ollama_models: {}, redis_data: {}}
